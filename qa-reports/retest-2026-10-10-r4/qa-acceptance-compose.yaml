services:
  app:
    environment:
      WAVESURGE_BASE_URL: "http://wave-fixture:8087/api/v1"
    ports: !override ["127.0.0.1:${QA_APP_PORT:-3500}:3000"]
  desktop:
    environment:
      DESKTOP_ALLOWED_TEST_ORIGINS: "http://127.0.0.1:8085,http://127.0.0.1:8086,http://wave-fixture:8087"
  wave-fixture:
    image: creator-studio-app:local
    command: ["node", "/fixtures/qa-wave-server.mjs"]
    volumes: ["./tests/fixtures/qa-wave-server.mjs:/fixtures/qa-wave-server.mjs:ro"]

networks:
  default:
    ipam:
      config:
        - subnet: 10.250.241.0/24
